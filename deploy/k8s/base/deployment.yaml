apiVersion: apps/v1
kind: Deployment
metadata:
  name: pardon-postgres
  namespace: pardon
  labels:
    app.kubernetes.io/name: pardon
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pardon
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pardon
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: pardon
            - name: POSTGRES_USER
              value: pardon
            - name: POSTGRES_PASSWORD
              value: pardon
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U pardon -d pardon
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U pardon -d pardon
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pardon-api
  namespace: pardon
  labels:
    app.kubernetes.io/name: pardon
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pardon
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pardon
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: dvc-pull
          image: pardon-api
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/app/scripts/k8s-dvc-pull.sh"]
          env:
            - name: PARDON_DVC_DATA_ROOT
              value: /mnt/pardon-data
          volumeMounts:
            - name: pardon-dvc-data
              mountPath: /mnt/pardon-data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      containers:
        - name: api
          image: pardon-api
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - uv run alembic upgrade head && uv run uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000
          envFrom:
            - configMapRef:
                name: pardon-config
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: pardon-dvc-data
              mountPath: /app/data/raw
              subPath: data/raw
            - name: pardon-dvc-data
              mountPath: /app/data/processed
              subPath: data/processed
            - name: pardon-dvc-data
              mountPath: /app/models/base_models
              subPath: models/base_models
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: pardon-dvc-data
          persistentVolumeClaim:
            claimName: pardon-dvc-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pardon-ui
  namespace: pardon
  labels:
    app.kubernetes.io/name: pardon
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pardon
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pardon
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: ui
          image: pardon-ui
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pardon-config
          ports:
            - name: http
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
