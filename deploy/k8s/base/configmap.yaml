apiVersion: v1
kind: ConfigMap
metadata:
  name: pardon-config
  namespace: pardon
data:
  API_TITLE: "PARDON Anomaly API"
  API_VERSION: "0.1.0"
  API_DEFAULT_MODEL: "isolation_forest"
  PARDON_DATABASE_URL: "postgresql+psycopg://pardon:pardon@pardon-postgres:5432/pardon"
  PARDON_RETRAIN_AUTH_ENABLED: "false"
  PARDON_RETRAIN_BEARER_TOKEN: ""
  PARDON_CORS_ALLOWED_ORIGINS: "http://pardon.local,http://localhost:3001"
  MLFLOW_TRACKING_URI: "http://pardon-mlflow:5000"
  MLFLOW_EXPERIMENT_NAME: "anomaly_detection"
  MLFLOW_INFERENCE_EXPERIMENT_NAME: "anomaly_detection_inference"
  MONITORING_ENABLED: "true"
  PROMETHEUS_PUSHGATEWAY_URL: "http://pardon-pushgateway:9091"
  PROMETHEUS_GROUPING_ENV: "kubernetes"
  PROMETHEUS_GROUPING_SERVICE: "pardon"
  API_BASE_URL: "http://pardon-api:8000"
  NEXT_PUBLIC_API_BASE_URL: "http://pardon-api:8000"
  NEXT_PUBLIC_RETRAIN_API_TOKEN: ""
