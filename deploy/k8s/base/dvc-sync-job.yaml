apiVersion: batch/v1
kind: Job
metadata:
  name: pardon-dvc-sync
  namespace: pardon
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app.kubernetes.io/name: pardon
    app.kubernetes.io/component: dvc-sync
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pardon
        app.kubernetes.io/component: dvc-sync
    spec:
      restartPolicy: Never
      containers:
        - name: dvc-pull
          image: pardon-api
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/app/scripts/k8s-dvc-pull.sh"]
          env:
            - name: PARDON_DVC_DATA_ROOT
              value: /mnt/pardon-data
          volumeMounts:
            - name: pardon-dvc-data
              mountPath: /mnt/pardon-data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: pardon-dvc-data
          persistentVolumeClaim:
            claimName: pardon-dvc-data
