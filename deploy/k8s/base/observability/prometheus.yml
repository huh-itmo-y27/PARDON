global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "pardon-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["pardon-api:8000"]

  - job_name: "pushgateway"
    static_configs:
      - targets: ["pardon-pushgateway:9091"]

  - job_name: "mlflow-exporter"
    static_configs:
      - targets: ["pardon-mlflow-exporter:8010"]
